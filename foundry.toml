[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
# Remappings come from remappings.txt alone. Left on, forge adds one for each folder it finds under lib/,
# and every contract's metadata records them, so the same sources would build to a different metadata
# hash in a checkout with other libraries present.
auto_detect_remappings = false

fs_permissions = [
    { access = "read", path = "chainlink-functions" },
    # The games tests pin the frozen interface from its build artifact.
    { access = "read", path = "out" },
    { access = "read-write", path = "deployments" },
    { access = "read", path = "lib/openzeppelin-contracts/package.json" },
]

[profile.ci]
solc = "0.8.26"

[profile.slither]
solc = "0.8.26"
via_ir = true
optimizer = true
optimizer_runs = 200

# [profile.coverage]
# Not needed — `forge coverage --ir-minimum` works after the PositionModule.t.sol
# stack-depth refactor (LocalEnv struct + Contest helper functions).

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
