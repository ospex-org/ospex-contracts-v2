name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

# The job only reads the repository. This also bounds what any installed tool could do with the token.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-80ae59941ada986c49e05f2a8412c3fc1f9075d0

      - name: Clone exact dependencies directly
        run: |
          # Remove any existing lib directories except the two submodules: forge-std and
          # openzeppelin-contracts, which the checkout above pins to their recorded commits
          rm -rf lib/chainlink lib/foundry-chainlink-toolkit

          # Clone chainlink directly to the exact commit you have locally
          git clone https://github.com/smartcontractkit/chainlink lib/chainlink
          cd lib/chainlink
          git checkout 0f769bbc0e
          cd ../..
          
          # Clone other dependencies
          git clone https://github.com/smartcontractkit/foundry-chainlink-toolkit lib/foundry-chainlink-toolkit

      - name: Verify dependencies are installed
        run: |
          echo "Verifying chainlink files exist:"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/libraries/FunctionsRequest.sol
          git -C lib/openzeppelin-contracts log -1 --format='openzeppelin-contracts at %H'
          echo "Dependencies installed successfully!"

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge build
        run: |
          forge build --via-ir --optimize --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --via-ir --optimize
        id: test

      # Slither is a report that never fails the build: each step below may fail without failing the job,
      # and Slither itself exits 0 whatever it finds (--fail-none). Its findings are dispositioned on the PR.
      - name: Install Slither (report only)
        if: always()
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/pip" install --disable-pip-version-check --no-deps --only-binary=:all: \
            -r .github/slither-requirements.txt
          echo "$RUNNER_TEMP/slither/bin" >> "$GITHUB_PATH"

      - name: Slither report (never fails the build)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          slither --version || true
          # Everything outside lib/, test/ and script/, in full, in this step's log.
          slither . --filter-paths "lib/|test/|script/" --fail-none > slither.txt 2>&1 || true
          cat slither.txt
          # The job summary shows the contracts being built now: not v2's deployed contracts
          # (src/core, src/modules, src/interfaces) or v2's Ethereum timelock (src/governance).
          {
            echo "## Slither: a report that never fails the build"
            echo
            echo "Scope: src/ outside v2's deployed contracts and v2's Ethereum timelock. The full report is in this step's log."
            echo
            slither . --foundry-ignore-compile \
              --filter-paths "lib/|test/|script/|src/core/|src/modules/|src/interfaces/|src/governance/" \
              --fail-none --checklist 2>/dev/null || echo "Slither did not run."
          } >> "$GITHUB_STEP_SUMMARY" || true