name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

# The job only reads the repository. This also bounds what any installed tool could do with the token.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-80ae59941ada986c49e05f2a8412c3fc1f9075d0

      - name: Clone exact dependencies directly
        run: |
          # Remove any existing lib directories except the two submodules: forge-std and
          # openzeppelin-contracts, which the checkout above pins to their recorded commits
          rm -rf lib/chainlink lib/foundry-chainlink-toolkit

          # Clone chainlink directly to the exact commit you have locally
          git clone https://github.com/smartcontractkit/chainlink lib/chainlink
          cd lib/chainlink
          git checkout 0f769bbc0e
          cd ../..
          
          # Clone other dependencies
          git clone https://github.com/smartcontractkit/foundry-chainlink-toolkit lib/foundry-chainlink-toolkit

      - name: Verify dependencies are installed
        run: |
          echo "Verifying chainlink files exist:"
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/FunctionsClient.sol
          ls -la lib/chainlink/contracts/src/v0.8/functions/v1_0_0/libraries/FunctionsRequest.sol
          git -C lib/openzeppelin-contracts log -1 --format='openzeppelin-contracts at %H'
          echo "Dependencies installed successfully!"

      - name: Show Forge version
        run: |
          forge --version

      # A via-IR compile is one solc process that keeps memory for every contract it has compiled. Measured on a
      # 64 GB machine, the whole project's peak working set was 17.8 GB at 181 files, 21.2 GB at 183 with the
      # shared collateral tests, and about 24 GB at 191 with the approved agent's tests; this runner has 16 GB.
      # Twice the build step ended with exit code 143 and no other line once the compile crossed what the runner
      # had. So the compile is cut in three below, each its own solc process: the sources alone for the sizes
      # table, then the tests in two groups by path, the betting set's folder (14.7 GB alone on the same machine)
      # and every other folder. The swap stays for the margin the betting group still needs: the pages a compile
      # keeps and no longer touches are the ones that go there. The two `free` lines record what the runner had
      # before and after.
      - name: Add swap for the compile
        run: |
          free -h
          df -h / /mnt || df -h /
          target=/mnt/swapfile.ci
          [ -d /mnt ] || target=/swapfile.ci
          sudo fallocate -l 16G "$target"
          sudo chmod 600 "$target"
          sudo mkswap "$target"
          sudo swapon "$target"
          free -h

      - name: Run Forge build, the sources alone, for the sizes table
        run: |
          forge build --via-ir --optimize --sizes --skip 'test/**' --skip 'script/**'
        id: build

      # The tests in two groups by path, each compiled on its own: the betting set's folder, then everything
      # else under test/. Every test file is in exactly one group; the check refuses a tree where that is not so,
      # and the two steps' summary lines, read together, are the whole inventory.
      - name: Check that the two test groups cover every test file once
        run: |
          all=$(find test -name '*.t.sol' | sort)
          betting=$(find test/betting -name '*.t.sol' | sort)
          others=$(find test -name '*.t.sol' -not -path 'test/betting/*' | sort)
          both=$(printf '%s\n%s\n' "$betting" "$others" | sort)
          test "$both" = "$all"
          echo "the betting set: $(printf '%s\n' "$betting" | wc -l) test files; every other folder: $(printf '%s\n' "$others" | wc -l)"

      - name: Run Forge tests, the betting set
        run: |
          FOUNDRY_TEST=test/betting forge test -vvv --via-ir --optimize
        id: test-betting

      - name: Run Forge tests, every other folder
        run: |
          forge test -vvv --via-ir --optimize --skip 'test/betting/**'
        id: test-others

      # Slither is a report that never fails the build: each step below may fail without failing the job,
      # and Slither itself exits 0 whatever it finds (--fail-none). Its findings are dispositioned on the PR.
      - name: Install Slither (report only)
        if: always()
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/slither"
          "$RUNNER_TEMP/slither/bin/pip" install --disable-pip-version-check --no-deps --only-binary=:all: \
            -r .github/slither-requirements.txt
          echo "$RUNNER_TEMP/slither/bin" >> "$GITHUB_PATH"

      - name: Slither report (never fails the build)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          slither --version || true
          # Everything outside lib/, test/ and script/, in full, in this step's log.
          slither . --filter-paths "lib/|test/|script/" --fail-none > slither.txt 2>&1 || true
          cat slither.txt
          # The job summary shows the contracts being built now: not v2's deployed contracts
          # (src/core, src/modules, src/interfaces) or v2's Ethereum timelock (src/governance).
          {
            echo "## Slither: a report that never fails the build"
            echo
            echo "Scope: src/ outside v2's deployed contracts and v2's Ethereum timelock. The full report is in this step's log."
            echo
            slither . --foundry-ignore-compile \
              --filter-paths "lib/|test/|script/|src/core/|src/modules/|src/interfaces/|src/governance/" \
              --fail-none --checklist 2>/dev/null || echo "Slither did not run."
          } >> "$GITHUB_STEP_SUMMARY" || true